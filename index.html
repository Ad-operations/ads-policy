<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verdict Desk: Middle East Version</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14122a;--card:#221f3d;--ink:#f2eefc;--mut:#a9a3c9;--line:#40396b;--gold:#f2b73f;--ok:#58c79f;--bad:#ef8d7f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Source Sans 3",system-ui,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font:700 1.3rem Sora,system-ui,sans-serif;margin:0 0 6px}
#hud{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);margin-bottom:8px}#hud b{color:var(--gold)}
#wrap{position:relative}
canvas{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:#1d1b34}
#ui{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,24,.72);border-radius:10px;padding:10px;overflow:auto}
.pn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:600px;width:100%;max-height:100%;overflow:auto}
.pn h3{font:700 1.05rem Sora,system-ui,sans-serif;margin:14px 0 8px}
.ad{font:700 1.1rem Sora,system-ui,sans-serif;border-left:4px solid var(--gold);padding-left:12px}
.mt{color:var(--mut);font-size:.92rem;margin:8px 0 0}
.opt,.btn{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#2c2850;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:#12332a}.opt.bad{border-color:var(--bad);background:#3a1d19}
.btn{width:auto;background:var(--gold);color:#1b1630;font-weight:600;border:0;margin-top:12px}
a{color:var(--gold)}
.pass{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.st{border:2px dashed var(--line);border-radius:8px;padding:8px;text-align:center;color:var(--mut)}.st.on{border:2px solid var(--gold);color:var(--gold)}
.note{color:var(--mut);font-size:.85rem;margin-top:10px}

body{background:radial-gradient(1200px 600px at 50% -10%,#2a2150 0%,#14122a 60%) fixed}
#hud{gap:10px}.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 14px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-block}.dot.ok{background:#58c79f;box-shadow:0 0 8px #58c79f}.dot.bad{background:#ef8d7f;box-shadow:0 0 8px #ef8d7f}
canvas{border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 60px rgba(242,183,63,.08)}
#ui{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.pn{background:rgba(30,26,58,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.opt{background:rgba(255,255,255,.06);border-radius:12px;transition:transform .12s,border-color .12s,background .12s}.opt:hover:not(:disabled){transform:translateY(-1px);background:rgba(255,255,255,.1)}
.btn{border-radius:12px;box-shadow:0 6px 18px rgba(242,183,63,.3)}.ad{background:rgba(255,255,255,.05);border-radius:0 10px 10px 0;padding:8px 12px}
@media(prefers-reduced-motion:reduce){.pn{animation:none}.opt{transition:none}}

html,body{height:100%;overflow:hidden}body{margin:0}main{max-width:none;padding:0}h1{display:none}
#wrap{position:fixed;inset:0;background:#0d0b1f;z-index:1}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0;border-radius:0;box-shadow:none;background:#0d0b1f}
#ui{border-radius:0}.pn{max-width:680px;max-height:92vh}
#hud{position:fixed;top:10px;left:12px;z-index:5;margin:0}
#fs{position:fixed;top:10px;right:12px;z-index:6;font:600 14px "Source Sans 3",system-ui,sans-serif;color:#f2eefc;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 14px;cursor:pointer}
#fs:focus-visible{outline:3px solid #f2b73f;outline-offset:2px}
.note{position:fixed;bottom:6px;left:0;right:0;z-index:2;margin:0;text-align:center;font-size:.8rem;opacity:.65;pointer-events:none}
.ci{display:block;max-height:200px;width:auto;max-width:100%;margin:0 auto 10px;border-radius:12px}
</style>

ro:["Dating content violates policy. Rejected.","This can run in Germany but not in Saudi Arabia or Kuwait, where dating ads are restricted. The creative needs no change.","Approved in all targeted countries."],ra:1,
why:"Dating ads are restricted only in a named country list that includes Saudi Arabia and Kuwait, so a mixed campaign is Eligible (limited). A secondary report counted 17 countries while the official page names 18: read the live page.",src:[["Dating policy update","https://support.google.com/adspolicy/answer/16473212"]]},
